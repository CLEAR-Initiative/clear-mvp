<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#E85D3D" />
    <meta name="color-scheme" content="light dark" />
    <title>CLEAR — Offline</title>
    <!--
      Self-contained document fallback for the PWA service worker.
      No external CSS/JS — must render while the network is fully down.
    -->
    <style>
      :root {
        --bg: #fafafa;
        --text: #171717;
        --muted: #525252;
        --border: rgba(0, 0, 0, 0.2);
        --btn-bg: rgba(0, 0, 0, 0.03);
        --btn-bg-hover: rgba(0, 0, 0, 0.06);
        --accent: #e85d3d;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111111;
          --text: #f0f0f0;
          --muted: #a3a3a3;
          --border: rgba(255, 255, 255, 0.2);
          --btn-bg: rgba(255, 255, 255, 0.05);
          --btn-bg-hover: rgba(255, 255, 255, 0.08);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Calibri, "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      }

      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-top: max(24px, env(safe-area-inset-top));
        padding-bottom: max(24px, env(safe-area-inset-bottom));
      }

      main {
        width: 100%;
        max-width: 420px;
        text-align: center;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 40px;
      }

      .brand svg {
        display: block;
        flex-shrink: 0;
        border-radius: 4px;
      }

      .brand-name {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.02em;
        line-height: 1;
      }

      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        color: var(--muted);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        font-weight: 700;
        line-height: 1.25;
      }

      p {
        margin: 0 auto 28px;
        max-width: 36ch;
        font-size: 15px;
        line-height: 1.5;
        color: var(--muted);
      }

      button {
        appearance: none;
        padding: 10px 20px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--btn-bg);
        color: var(--text);
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      button:hover {
        background: var(--btn-bg-hover);
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand" aria-label="CLEAR">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 227 227.7"
          width="40"
          height="40"
          role="img"
          aria-label="NRC"
        >
          <rect width="226.4" height="226.4" fill="#FD5A00" />
          <path
            fill="#FFFFFF"
            d="M66.2,176.2l-25.4-47l0.4,47H24.6V97.5h16.6l25.4,47l-0.4-47h16.6v78.7H66.2z"
          />
          <path
            fill="#FFFFFF"
            d="M108.4,176.2H91.6V97.4h26.8c21.2,0,28.5,9.7,28.1,24.7c-0.4,13.5-5.4,17.2-13.7,21.2l19.3,32.9h-19.6l-15.9-29.5h-8.2V176.2z M108.4,131.4h11.4c7.5,0,8.4-5,8.4-9.3s-0.9-9.3-8.4-9.3h-11.4V131.4z"
          />
          <path
            fill="#FFFFFF"
            d="M185.5,95.9c9.1,0,13.2,1.7,16.4,2.9v15.9c-4.6-2.1-9.6-3.1-14.7-3c-12.8,0-18.7,5.1-18.7,25.1s5.9,25.1,18.7,25.1c5.1,0.1,10.1-0.9,14.7-3v15.8c-3.1,1.3-7.2,2.9-16.4,2.9c-23,0-33.9-11.2-34-40.8C151.6,107.2,162.5,95.9,185.5,95.9z"
          />
        </svg>
        <span class="brand-name">CLEAR</span>
      </div>

      <svg
        class="icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path
          d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
        />
        <line x1="12" y1="9" x2="12" y2="13" />
        <line x1="12" y1="17" x2="12.01" y2="17" />
      </svg>

      <h1 id="title">You're offline</h1>
      <p id="body">
        No internet connection. Check your network, then try again to reopen
        CLEAR.
      </p>
      <button type="button" id="retry">Try again</button>
    </main>

    <script>
      (function () {
        var copy = {
          en: {
            title: "You're offline",
            body: "No internet connection. Check your network, then try again to reopen CLEAR.",
            retry: "Try again",
            docTitle: "CLEAR — Offline",
          },
          es: {
            title: "Sin conexión",
            body: "No hay conexión a internet. Comprueba tu red e inténtalo de nuevo para volver a CLEAR.",
            retry: "Reintentar",
            docTitle: "CLEAR — Sin conexión",
          },
          fr: {
            title: "Hors ligne",
            body: "Pas de connexion Internet. Vérifiez votre réseau, puis réessayez pour rouvrir CLEAR.",
            retry: "Réessayer",
            docTitle: "CLEAR — Hors ligne",
          },
          ar: {
            title: "أنت غير متصل",
            body: "لا يوجد اتصال بالإنترنت. تحقق من شبكتك ثم حاول مرة أخرى لفتح CLEAR.",
            retry: "حاول مرة أخرى",
            docTitle: "CLEAR — غير متصل",
          },
        };

        var lang = (navigator.language || "en").slice(0, 2).toLowerCase();
        var t = copy[lang] || copy.en;
        document.documentElement.lang = copy[lang] ? lang : "en";
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        document.title = t.docTitle;
        document.getElementById("title").textContent = t.title;
        document.getElementById("body").textContent = t.body;
        document.getElementById("retry").textContent = t.retry;

        document.getElementById("retry").addEventListener("click", function () {
          location.reload();
        });

        window.addEventListener("online", function () {
          location.reload();
        });
      })();
    </script>
  </body>
</html>
