<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle - CLEAR brand orange for Restricted -->
  <circle cx="32" cy="32" r="28" fill="#EA580C"/>
  
  <!-- Bridge structure (white) -->
  <g stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round">
    <!-- Top deck -->
    <line x1="14" y1="34" x2="50" y2="34"/>
    <!-- Left arch -->
    <path d="M 18 34 Q 22 38 26 34" fill="none"/>
    <!-- Center arch -->
    <path d="M 26 34 Q 32 40 38 34" fill="none"/>
    <!-- Right arch -->
    <path d="M 38 34 Q 42 38 46 34" fill="none"/>
  </g>
  
  <!-- Exclamation mark overlay (white) -->
  <g fill="#FFFFFF">
    <!-- Exclamation stem -->
    <rect x="30" y="20" width="4" height="14" rx="2"/>
    <!-- Exclamation dot -->
    <circle cx="32" cy="40" r="2.5"/>
  </g>
</svg>
