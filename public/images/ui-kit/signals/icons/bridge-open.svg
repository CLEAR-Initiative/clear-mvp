<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle - Green for Open (not used in blockages) -->
  <circle cx="32" cy="32" r="28" fill="#10B981"/>
  
  <!-- Bridge structure (white) -->
  <g stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round">
    <!-- Top deck -->
    <line x1="14" y1="34" x2="50" y2="34"/>
    <!-- Left arch -->
    <path d="M 18 34 Q 22 38 26 34" fill="none"/>
    <!-- Center arch -->
    <path d="M 26 34 Q 32 40 38 34" fill="none"/>
    <!-- Right arch -->
    <path d="M 38 34 Q 42 38 46 34" fill="none"/>
  </g>
  
  <!-- Checkmark overlay (white) -->
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="24,32 30,38 42,24"/>
  </g>
</svg>
