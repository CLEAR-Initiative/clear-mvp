<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle - CLEAR brand red for Not Passable -->
  <circle cx="32" cy="32" r="28" fill="#B91C1C"/>
  
  <!-- Bridge structure (white) -->
  <g stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round">
    <!-- Top deck -->
    <line x1="14" y1="34" x2="50" y2="34"/>
    <!-- Left arch -->
    <path d="M 18 34 Q 22 38 26 34" fill="none"/>
    <!-- Center arch -->
    <path d="M 26 34 Q 32 40 38 34" fill="none"/>
    <!-- Right arch -->
    <path d="M 38 34 Q 42 38 46 34" fill="none"/>
  </g>
  
  <!-- X mark overlay (white) -->
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round">
    <line x1="22" y1="22" x2="42" y2="42"/>
    <line x1="42" y1="22" x2="22" y2="42"/>
  </g>
</svg>
