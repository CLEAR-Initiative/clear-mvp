name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr_agent:
    # Loop guard: never let the action respond to its own (Bot) events.
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: PR Agent action
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC.KEY: ${{ secrets.PR_AGENT_ANTHROPIC_KEY }}
          config.model: "anthropic/claude-sonnet-4-6"
          config.fallback_models: '["anthropic/claude-sonnet-4-6"]'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          # WEBHOOK ACTION TYPES that trigger the auto tools (NOT tool names).
          # Must mirror the on.pull_request.types list above.
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
