name: Check / Dev smoke after deploy

# After a dev release, signs in on the deployed dev site and opens Detection
# (e2e/deployed, playwright.deployed.config.ts). A failure turns this run red
# and posts a message in the deploy Matrix room, so a broken dev deploy is
# reported before a person opens the site.
#
# Triggers:
#   - `Release / dev` finished with success (a clear-mvp image was pushed).
#   - `workflow_call`: for the clear-api dev release, which calls this
#     workflow with `secrets: inherit`.
#   - `workflow_dispatch`: run it by hand.
#
# Watchtower on the dev app VM polls the registry every 30 s, so the job waits
# before it tests. It does not know which image the site runs: it tests the
# site as it is after the wait.
#
# Secrets (on this repo, and on clear-api for its calls; organisation secrets
# cover both):
#   DEV_SMOKE_EMAIL, DEV_SMOKE_PASSWORD   a dev account with read access
#   MATRIX_DEPLOY_HOMESERVER              host name, no scheme
#   MATRIX_DEPLOY_ROOM                    room id (`!…:host`)
#   MATRIX_DEPLOY_TOKEN                   access token of a user in that room
# Without the account secrets the job skips the test and says so. Without the
# Matrix secrets a failure is red here only.

on:
  workflow_run:
    workflows: ["Release / dev"]
    types: [completed]
  workflow_call:
    secrets:
      DEV_SMOKE_EMAIL:
        required: false
      DEV_SMOKE_PASSWORD:
        required: false
      MATRIX_DEPLOY_HOMESERVER:
        required: false
      MATRIX_DEPLOY_ROOM:
        required: false
      MATRIX_DEPLOY_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Dev smoke
    # A failed or cancelled release pushed no image: nothing to test.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMOKE_BASE_URL: https://dev.clearinitiative.io
      SMOKE_EMAIL: ${{ secrets.DEV_SMOKE_EMAIL }}
      SMOKE_PASSWORD: ${{ secrets.DEV_SMOKE_PASSWORD }}
      MATRIX_HOMESERVER: ${{ secrets.MATRIX_DEPLOY_HOMESERVER }}
      MATRIX_ROOM: ${{ secrets.MATRIX_DEPLOY_ROOM }}
      MATRIX_TOKEN: ${{ secrets.MATRIX_DEPLOY_TOKEN }}
    steps:
      - name: Check the account secrets
        id: config
        run: |
          if [ -z "$SMOKE_EMAIL" ] || [ -z "$SMOKE_PASSWORD" ]; then
            echo "::warning::DEV_SMOKE_EMAIL or DEV_SMOKE_PASSWORD is not set: the dev smoke did not run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Always clear-mvp at dev: in a call from clear-api the default checkout
      # would be clear-api.
      - name: Checkout clear-mvp
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: CLEAR-Initiative/clear-mvp
          ref: dev

      - name: Set up Bun
        if: steps.config.outputs.ready == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.1

      - name: Install suite deps
        if: steps.config.outputs.ready == 'true'
        run: bun install --frozen-lockfile

      - name: Cache Playwright Chromium
        if: steps.config.outputs.ready == 'true'
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium (cache miss)
        if: steps.config.outputs.ready == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Chromium OS deps
        if: steps.config.outputs.ready == 'true'
        run: bunx playwright install-deps chromium

      # The install steps above take over a minute, which is already longer
      # than a Watchtower poll plus a container start. Then wait until the
      # site answers: a container that is still starting gives 502.
      - name: Wait for dev to answer
        if: steps.config.outputs.ready == 'true'
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "$SMOKE_BASE_URL/auth/login" || true)
            if [ "$code" = "200" ]; then exit 0; fi
            echo "attempt $i: HTTP $code"
            sleep 10
          done
          echo "::error::$SMOKE_BASE_URL/auth/login did not answer 200 in 5 minutes."
          exit 1

      - name: Run the smoke
        if: steps.config.outputs.ready == 'true'
        run: bunx playwright test --config playwright.deployed.config.ts

      - name: Upload Playwright report + traces
        if: ${{ !cancelled() && steps.config.outputs.ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dev-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Report the failure in the deploy Matrix room
        if: ${{ failure() && env.MATRIX_TOKEN != '' && env.MATRIX_ROOM != '' && env.MATRIX_HOMESERVER != '' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOYED_REPO: ${{ github.repository }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          text="Dev smoke FAILED after a deploy of ${DEPLOYED_REPO} (${DEPLOYED_SHA:0:7}): sign-in or Detection is broken on ${SMOKE_BASE_URL}. Run: ${RUN_URL}"
          room=$(jq -rn --arg r "$MATRIX_ROOM" '$r | @uri')
          body=$(jq -n --arg b "$text" '{msgtype: "m.text", body: $b}')
          curl -fsS -X PUT \
            -H "Authorization: Bearer ${MATRIX_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$body" \
            "https://${MATRIX_HOMESERVER}/_matrix/client/v3/rooms/${room}/send/m.room.message/dev-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            > /dev/null
