name: Build & deploy (dev / staging)

# Push to dev → build → deploy to dev VM
# Push to staging → build → deploy to staging VM

on:
  push:
    branches: [dev, staging]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Owner must be lowercase - Docker rejects mixed-case refs even though GHCR
  # is case-insensitive on the server side. Lowercased below via a step output.

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    # Scope to the GitHub Environment matching the branch (dev or staging) so
    # NEXT_PUBLIC_* build-args can be read from per-env secrets.
    environment: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name + tags
        id: meta
        # Lowercase the repo owner (Docker requirement) and emit the full
        # image-name + a sha-bearing tag for traceability.
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image_name=${OWNER_LC}/clear-mvp" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${GITHUB_REF_NAME}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        # NEXT_PUBLIC_* values are INLINED into the client bundle at build time
        # - they CANNOT be overridden by docker compose env_file at runtime.
        # That's why they're passed here as build-args, sourced from per-env
        # GitHub Environment secrets (Settings → Environments → dev/staging).
        # Image is tagged with both the branch name and sha for traceability.
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.sha_tag }}
          build-args: |
            NEXT_PUBLIC_MAPBOX_TOKEN=${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENV=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    # `packages: read` lets the run's GITHUB_TOKEN pull the private GHCR image;
    # we pass it into the SSH session and `docker login` there so the deploy no
    # longer depends on a persistent (expirable) `docker login` on the VM.
    permissions:
      contents: read
      packages: read
    environment: ${{ github.ref_name }}
    steps:
      - name: SSH and roll the deployment
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.APP_VM_HOST }}
          username: ubuntu
          key: ${{ secrets.APP_VM_SSH_KEY }}
          envs: GHCR_TOKEN
          script: |
            set -e
            # Authenticate to GHCR every deploy — no reliance on a VM-side login
            # that can silently expire (the cause of the `denied` pull error).
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /srv/app
            docker compose pull clear-mvp
            # --force-recreate destroys + recreates the container against the
            # freshly pulled image. Without it, compose sometimes sees "no
            # compose config change" and skips, leaving the container on the
            # old image even though the new one was pulled.
            docker compose up -d --force-recreate clear-mvp
            docker image prune -a -f
            docker compose ps clear-mvp
