name: Unit tests

# Fast gate on every PR to dev: Vitest unit suite, TypeScript typecheck, and the
# translation-catalog guard (scripts/check-messages.mjs), plus ESLint. Runs
# alongside the heavier E2E smoke workflow; both are required status checks on dev.
#
# Lint fails on errors only; warnings (unused vars, exhaustive-deps, <img>) are
# reported but non-blocking until they are burned down. The job name below is
# the required status check, so it stays "Unit tests + typecheck".

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.1

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Vitest
        run: bunx vitest run

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Translation catalogs in sync
        run: node scripts/check-messages.mjs
